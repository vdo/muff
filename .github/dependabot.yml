version: 2

# Pinning actions to commit SHAs stops a tag from being repointed at hostile
# code, but it also freezes them — including past security fixes. Dependabot
# is the other half of that trade: it bumps the pinned SHA and updates the
# `# vN` comment beside it, so every change arrives as a reviewable diff.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Security fixes should not wait behind a queue of routine bumps.
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - rust
    groups:
      # One PR for routine patch/minor churn; majors stay separate so they get
      # read properly.
      minor-and-patch:
        update-types:
          - minor
          - patch
