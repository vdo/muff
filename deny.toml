# cargo-deny configuration — supply-chain policy for muff.
#
# Enforced in CI (.github/workflows/ci.yml) and again as a gate on every
# release. Run locally with:
#
#     cargo install cargo-deny --locked
#     cargo deny --all-features check advisories bans licenses sources

[graph]
all-features = true

# ---------------------------------------------------------------------------
# Known vulnerabilities and unmaintained crates (RustSec advisory database)
# ---------------------------------------------------------------------------
[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# A yanked crate is a maintainer signal that something is wrong with it.
yanked = "deny"
# Add advisory IDs here ONLY with a comment explaining why the wallet is not
# affected and when the entry can be removed. An empty list is the goal.
ignore = []

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------
# muff itself is MIT. This list is the set actually present in the dependency
# graph — all permissive, plus MPL-2.0 (file-level copyleft, which does not
# reach this crate's own source). A new dependency introducing anything else
# fails the build rather than quietly changing the project's obligations.
[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "WTFPL",
  "Zlib",
]
# Do not fail merely because an allowed license is currently unused; the list
# above is intentionally the full permissive set we accept.
unused-allowed-license = "allow"

# ---------------------------------------------------------------------------
# Dependency hygiene
# ---------------------------------------------------------------------------
[bans]
# Duplicates are warned about, not denied: the ecosystem is mid-migration on
# rand/getrandom and forcing a single version is not currently achievable.
multiple-versions = "warn"
# A wildcard version requirement means any future release is accepted sight
# unseen — exactly the supply-chain risk this file exists to prevent.
wildcards = "deny"
deny = []

# ---------------------------------------------------------------------------
# Where code is allowed to come from
# ---------------------------------------------------------------------------
# crates.io only. A git dependency is mutable by whoever controls the branch,
# so it cannot be audited or reproduced from Cargo.lock alone; adding one must
# be a deliberate, reviewed change to this file.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
